[project]
name = "pyodide-code-execution"
version = "0.1.1"
description = "An open-webui tools, Use Pyodide to execute the provided Python code and return the output."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "matplotlib>=3.10.8",
    "open-webui>=0.7.2",
    "ruff>=0.14.10",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
